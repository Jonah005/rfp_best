# Root lint configuration, so files outside backend/ (currently run_local.py)
# are checked with the same rules wherever ruff is invoked from. The backend has
# its own equivalent config in backend/pyproject.toml; keep the two in step.
line-length = 100
target-version = "py310"
extend-exclude = ["backend", "frontend"]

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]
